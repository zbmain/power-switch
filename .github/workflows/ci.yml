name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check when called by the release workflow.
        required: false
        type: string

permissions:
  contents: read

# 被 Release 复用时不与发布工作流使用同一并发组。
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  frontend:
    name: Frontend and release checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:release
      - name: Check project versions
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          pnpm release:check -- "v${VERSION}"
      - run: pnpm build:web
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Rust (${{ matrix.os }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.run_id }}
          path: dist/
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
