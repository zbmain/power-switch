name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v<SemVer> tag to build.
        required: true
        type: string
      repair_existing_release:
        description: Add assets to an existing stable release only if it has no uploaded assets.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          path: release-source
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check version and master ancestry
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_ROOT: ${{ github.workspace }}/release-source
        run: |
          node scripts/release.mjs check "$RELEASE_TAG"
          test "$(git -C release-source rev-parse HEAD)" = "$(git -C release-source rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git -C release-source merge-base --is-ancestor HEAD origin/master

  checks:
    name: Release quality gate
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

  build:
    name: Bundle (${{ matrix.platform }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-universal
            os: macos-14
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - platform: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: msi
          - platform: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            rust-targets: aarch64-pc-windows-msvc
            bundles: msi
          - platform: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - platform: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            rust-targets: aarch64-unknown-linux-gnu
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          path: release-source
      - uses: ./.github/actions/setup
        with:
          targets: ${{ matrix.rust-targets }}
      - run: pnpm install --frozen-lockfile
        working-directory: release-source
      - name: Build desktop bundles
        run: pnpm tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
        working-directory: release-source
        env:
          CI: "true"
      - name: Collect named assets
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_ROOT: ${{ github.workspace }}/release-source
        run: node scripts/release.mjs collect "$RELEASE_TAG" "$RELEASE_PLATFORM"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-source/release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish complete prerelease
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          path: release-source
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-source/release-assets/
          merge-multiple: true
      - name: Validate, upload draft and publish atomically
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_ROOT: ${{ github.workspace }}/release-source
          REPAIR_STABLE_RELEASE: ${{ inputs.repair_existing_release || false }}
