name: Desktop build environment
description: Install the pinned Node, pnpm, Rust and native desktop dependencies.
inputs:
  targets:
    description: Additional Rust targets, separated by commas.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - uses: dtolnay/rust-toolchain@1.92.0
      with:
        components: rustfmt, clippy
        targets: ${{ inputs.targets }}
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri -> target
        key: ${{ inputs.targets }}
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config curl wget file patchelf rpm \
          libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev \
          libayatana-appindicator3-dev libxdo-dev
